name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON and site assets
        run: |
          python -m json.tool docs/data/catalog.json >/dev/null
          test -s docs/index.html
          test -s docs/assets/app.js
          test -s docs/assets/style.css
